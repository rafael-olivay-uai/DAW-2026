<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Suscribite - TyC Sports</title>
</head>
<body>

    <header class="site-header">
        <div class="header-top">
            <div class="header-left">
                <button class="icon-btn" aria-label="Menú">&#9776;</button>
                <button class="icon-btn" aria-label="Buscar">&#128269;</button>
            </div>
            <div class="header-logo">
                <span class="logo-tyc">TyC</span><span class="logo-sports"> Sports</span>
            </div>
            <div class="header-right">
                <button class="btn-bell" aria-label="Notificaciones">
                    <span class="bell-icon">&#128276;</span>
                    <span class="bell-badge">3</span>
                </button>
                <button class="btn-avatar btn-avatar--mobile" aria-label="Perfil de usuario">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" fill="#fff"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="btn-ingresar btn-ingresar--desktop" aria-label="Ingresar">&#128100; INGRESAR</button>
            </div>
        </div>

        <nav class="header-topics">
            <a href="#">BOCA</a>
            <a href="#">RIVER</a>
            <a href="#">REAL MADRID</a>
            <a href="#">LA LIGA</a>
        </nav>
    </header>

    <main class="subscription-container">

        <section class="subscription-section">

            <h1 class="subscription-title" id="form-title">HOLA</h1>
            <p class="subscription-subtitle">Suscribite y recibí las últimas noticias directo en tu correo.</p>

            <form class="subscription-form" id="subscription-form" novalidate>

                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                    <span class="error-message" id="error-name"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <span class="error-message" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                    <span class="error-message" id="error-password"></span>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Repetir contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password">
                    <span class="error-message" id="error-confirm-password"></span>
                </div>

                <div class="form-group">
                    <label for="age">Edad</label>
                    <input type="number" id="age" name="age">
                    <span class="error-message" id="error-age"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone">
                    <span class="error-message" id="error-phone"></span>
                </div>

                <div class="form-group">
                    <label for="address">Dirección</label>
                    <input type="text" id="address" name="address" autocomplete="street-address">
                    <span class="error-message" id="error-address"></span>
                </div>

                <div class="form-group">
                    <label for="city">Ciudad</label>
                    <input type="text" id="city" name="city" autocomplete="address-level2">
                    <span class="error-message" id="error-city"></span>
                </div>

                <div class="form-group">
                    <label for="postal-code">Código postal</label>
                    <input type="text" id="postal-code" name="postal-code" autocomplete="postal-code">
                    <span class="error-message" id="error-postal-code"></span>
                </div>

                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni">
                    <span class="error-message" id="error-dni"></span>
                </div>

                <div class="form-group form-group--full">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <p class="footer-copy">&copy; 2026 TyC Sports. Todos los derechos reservados.</p>
        <nav class="footer-nav" aria-label="Navegación del pie de página">
            <a href="#">La Liga</a>
            <a href="#">Real Madrid</a>
            <a href="#">Champions League</a>
        </nav>
    </footer>

    <script src="./validate.js" defer></script>
</body>
</html>
